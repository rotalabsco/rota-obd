name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Testes e APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk rota-obd-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rota-obd-debug
          path: rota-obd-debug.apk

      - name: Publicar versão de teste
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rota-obd-debug.apk \
            --prerelease \
            --title "Versão de teste #${{ github.run_number }}" \
            --notes "APK de depuração gerado automaticamente a partir de ${{ github.sha }}. Instale na central e permita fontes desconhecidas."

      - name: Abrir issue com o erro de build
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build #${{ github.run_number }} falhou em ${{ github.sha }}."
            echo
            echo '### Erros de compilação'
            echo '```'
            grep -E '^(e:|w: .*error)|error:|FAILED|What went wrong' -A3 build.log | head -n 120 || true
            echo '```'
            echo
            echo '### Final do log'
            echo '```'
            tail -n 120 build.log || true
            echo '```'
          } > issue.md
          gh issue create --title "Build #${{ github.run_number }} falhou" --label build-falhou --body-file issue.md \
            || gh issue create --title "Build #${{ github.run_number }} falhou" --body-file issue.md
