name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Chave de depuração fixa: sem ela cada build gera uma chave nova e o APK não instala por cima
      # do anterior (o Android exige a mesma assinatura). Fica no segredo DEBUG_KEYSTORE_B64.
      - name: Chave de assinatura fixa
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "Usando a chave de depuração do segredo:"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:'
          else
            echo "::warning::Segredo DEBUG_KEYSTORE_B64 ausente: o APK sai com chave nova e não atualiza o instalado."
          fi

      - name: Testes e APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rota-obd-debug.apk
          # Confere a assinatura: tem de ser a mesma em todo build, senão a atualização pelo app é recusada.
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs rota-obd-debug.apk | grep 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: rota-obd-debug
          path: rota-obd-debug.apk

      - name: Publicar versão de teste
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As linhas "- ..." aparecem no app, na aba Versão, como "o que mudou".
          {
            echo "APK de depuração gerado a partir de ${{ github.sha }}. Instale na central e permita fontes desconhecidas."
            echo
            echo "O que mudou (commits recentes):"
            git log -15 --no-merges --pretty='- %s'
          } > notas.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rota-obd-debug.apk \
            --prerelease \
            --title "Versão de teste #${{ github.run_number }}" \
            --notes-file notas.md

      - name: Abrir issue com o erro de build
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build #${{ github.run_number }} falhou em ${{ github.sha }}."
            echo
            echo '### Erros de compilação'
            echo '```'
            grep -E '^(e:|w: .*error)|error:|FAILED|What went wrong' -A3 build.log | head -n 120 || true
            echo '```'
            echo
            echo '### Final do log'
            echo '```'
            tail -n 120 build.log || true
            echo '```'
          } > issue.md
          gh issue create --title "Build #${{ github.run_number }} falhou" --label build-falhou --body-file issue.md \
            || gh issue create --title "Build #${{ github.run_number }} falhou" --body-file issue.md
